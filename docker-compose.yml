
services:
      
  blog:
    build:
      context: .
      target: prod
    image: blog:0.0.1
    container_name: blog
    restart: unless-stopped
    mem_limit: 128M
    mem_reservation: 64M
    env_file:
      - .env.production
    volumes:
      - /var/log/trascender/blog:/srv/cf.blog/logs
    environment:
      NODE_ENV: "production"
      PORT: 2207
    ports:
      - "127.0.0.1:2207:2207"